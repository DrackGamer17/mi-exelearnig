<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animación de una red informática</title>
  <!-- Los estilos están en estilos.css y la lógica de la animación en script.js -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1 id="titulo">Red informática: ¿cómo viaja la información?</h1>
  <p id="mensaje">Pulsa un botón para enviar un paquete.</p>

  <!-- Lienzo donde script.js dibuja la animación -->
  <canvas id="lienzo" width="900" height="460">
    Tu navegador no admite la etiqueta canvas.
  </canvas>

  <!-- Los botones se crean desde script.js (ver CONFIG.envios) -->
  <div id="botones"></div>

  <script src="script.js"></script>
</body>
</html>
